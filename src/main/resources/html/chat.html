<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>multimodal-llm-server</title>
    <link rel="stylesheet" href="/css/chat-common.css">
    <style>
        body {
            background: #f7f7f8;
            color: #1b1f24;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            margin: 0;
        }

        main {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0 auto;
            max-width: 920px;
            min-height: 0;
            padding: 18px 20px 20px;
        }

        .app-header {
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 14px;
            justify-content: space-between;
            padding: 0 0 14px;
        }

        .title {
            display: grid;
            gap: 2px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0;
        }

        .session {
            color: #64748b;
            font-size: 13px;
        }

        select,
        input,
        button {
            box-sizing: border-box;
            font: inherit;
        }

        select {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #111827;
            height: 36px;
            padding: 0 10px;
        }

        .chat-log {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 4px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant,
        .message-row.system {
            justify-content: flex-start;
        }

        .message {
            border: 1px solid transparent;
            border-radius: 14px;
            box-sizing: border-box;
            max-width: min(680px, 88%);
            overflow-wrap: anywhere;
            padding: 10px 13px;
            white-space: pre-wrap;
        }

        .message.user {
            background: #2563eb;
            color: #ffffff;
        }

        .message.user.partial {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a8a;
            opacity: 0.92;
        }

        .message.assistant {
            background: #ffffff;
            border-color: #e5e7eb;
            color: #111827;
        }

        .message.system {
            background: transparent;
            border-color: #d1d5db;
            color: #64748b;
            font-size: 13px;
        }

        .status {
            color: #57606a;
            font-size: 14px;
        }

        .composer {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
            display: grid;
            padding: 8px;
        }

        form {
            align-items: center;
            display: grid;
            gap: 6px;
            grid-template-columns: minmax(0, 1fr) 72px 36px 36px;
        }

        input {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            height: 36px;
            padding: 0 12px;
            width: 100%;
        }

        button {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            height: 36px;
            padding: 0 14px;
        }

        button[type="submit"] {
            background: #111827;
            border-color: #111827;
            color: #ffffff;
            font-weight: 700;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .fullscreen-button {
            display: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .fullscreen-button {
                align-items: center;
                display: inline-flex;
                justify-content: center;
            }
        }

        @media (max-width: 640px) {
            main {
                padding: 14px 12px 14px;
            }

            .app-header {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .message {
                max-width: 94%;
            }

            form {
                gap: 5px;
                grid-template-columns: minmax(0, 1fr) 64px 34px 34px;
            }

            .speech-state {
                font-size: 12px;
                gap: 6px;
                height: 34px;
                width: 64px;
            }

            .icon-button {
                height: 34px;
                width: 34px;
            }

            .icon-button svg {
                height: 18px;
                width: 18px;
            }

            input {
                height: 34px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
<main>
    <header class="app-header">
        <div class="title">
            <h1>multimodal-llm-server</h1>
            <span id="session" class="session"></span>
        </div>
        <select id="group" name="group">
            <option value="group-1">group-1</option>
            <option value="group-2">group-2</option>
            <option value="group-3">group-3</option>
        </select>
        <button id="fullscreen-toggle" class="fullscreen-button" type="button"
                aria-label="全画面表示" title="全画面表示">全画面</button>
    </header>
    <section id="response" class="chat-log" aria-live="polite"></section>
    <section class="composer">
        <form id="chat-form">
            <input id="message" name="message" autocomplete="off" placeholder="メッセージを入力">
            <span id="speech-state" class="speech-state" data-state="UNDETECTED" title="IDLE">
                <span class="state-dot"></span>
                <span id="speech-state-text">IDLE</span>
            </span>
            <button id="mic-toggle" class="icon-button" type="button" aria-label="マイク開始" title="マイク開始">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="2"></path>
                    <path d="M19 11a7 7 0 0 1-14 0M12 18v4M8 22h8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
                </svg>
            </button>
            <button class="icon-button primary" type="submit" aria-label="送信" title="送信">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle>
                    <path d="M12 16V8m0 0-4 4m4-4 4 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
            </button>
            <span id="mic-status" class="status sr-only">microphone stopped</span>
        </form>
    </section>
</main>
<script type="module">
    import { ChatAudio } from "/js/chat-audio.js";
    import { ChatEvents } from "/js/chat-events.js";

    const sessionId = crypto.randomUUID();
    const groupInput = document.getElementById("group");
    const response = document.getElementById("response");
    const messageInput = document.getElementById("message");
    const session = document.getElementById("session");
    const micToggle = document.getElementById("mic-toggle");
    const fullscreenToggle = document.getElementById("fullscreen-toggle");
    const micStatus = document.getElementById("mic-status");
    const speechState = document.getElementById("speech-state");
    const speechStateText = document.getElementById("speech-state-text");
    const partialTranscriptBubbles = new Map();
    let activeAssistantMessage = null;

    fullscreenToggle.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    updateFullscreenButton();

    const audio = new ChatAudio({
        group: () => groupInput.value,
        sessionId,
        clientLog: (event, fields) => events.clientLog(event, fields),
        onSystem: appendSystem,
        onSpeechStateDisplay: updateStatusDisplay,
        onAssistantText: appendAssistantDelta,
        onAssistantTextRemove: removeAssistantDelta,
        onMicStatus: (message) => {
            micStatus.textContent = message;
        },
        onMicRecording: updateMicrophoneButton
    });

    const events = new ChatEvents({
        group: () => groupInput.value,
        sessionId,
        statusFields: () => audio.statusFields(),
        onSystem: appendSystem,
        onUserMessage: finalizePartialTranscript,
        onMessage: (message) => appendMessage("assistant", message),
        onMessageDelta: () => events.clientLog("message-delta-ignored"),
        onMessageDone: () => {
            activeAssistantMessage = null;
            scrollToBottom();
        },
        onTranscriptPartial: (payload) => appendPartialTranscript(payload.speechSequenceId || 0, payload.text || ""),
        onAssistantAudioChunk: (payload) => audio.queueAudioDelta(payload),
        onAudioControl: (payload) => audio.handleAudioControl(payload),
        onSpeechState: (payload) => audio.updateSpeechState(payload.currentState || "UNDETECTED"),
        onAssistantState: (payload) => audio.updateAssistantState(payload.state || "IDLE"),
        onFacePresence: (payload) => appendSystem(facePresenceText(payload))
    });

    session.textContent = sessionLabel();
    events.connect();

    groupInput.addEventListener("change", () => {
        events.close();
        response.replaceChildren();
        activeAssistantMessage = null;
        partialTranscriptBubbles.clear();
        session.textContent = sessionLabel();
        events.clientLog("group-change", { detail: groupInput.value });
        events.connect();
    });

    document.getElementById("chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        await audio.preparePlayback();
        const message = messageInput.value.trim();
        if (!message) {
            return;
        }
        messageInput.value = "";
        const request = await fetch(`/chat/request?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
            method: "POST",
            headers: {"Content-Type": "text/plain; charset=utf-8"},
            body: message
        });
        if (!request.ok) {
            const text = await request.text();
            appendSystem(text || `HTTP ${request.status}`);
        }
    });

    micToggle.addEventListener("click", () => audio.toggleMicrophone());
    document.addEventListener("pointerdown", () => audio.preparePlayback(), { once: true });
    document.addEventListener("keydown", () => audio.preparePlayback(), { once: true });

    function appendMessage(role, message) {
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        const bubble = document.createElement("div");
        bubble.className = `message ${role}`;
        bubble.textContent = message;
        row.append(bubble);
        response.append(row);
        scrollToBottom();
        return bubble;
    }

    function appendPartialTranscript(speechSequenceId, message) {
        if (!speechSequenceId || !message.trim()) {
            return;
        }
        for (const id of partialTranscriptBubbles.keys()) {
            if (id < speechSequenceId) {
                partialTranscriptBubbles.delete(id);
            }
        }
        let bubble = partialTranscriptBubbles.get(speechSequenceId);
        if (!bubble || !bubble.isConnected) {
            bubble = appendMessage("user", "");
            bubble.classList.add("partial");
            partialTranscriptBubbles.set(speechSequenceId, bubble);
        }
        bubble.textContent = message;
        scrollToBottom();
    }

    function finalizePartialTranscript(message) {
        const latest = latestPartialTranscriptBubble();
        if (!latest) {
            appendMessage("user", message);
            return;
        }
        latest.bubble.textContent = message;
        latest.bubble.className = "message user";
        partialTranscriptBubbles.delete(latest.speechSequenceId);
        scrollToBottom();
    }

    function latestPartialTranscriptBubble() {
        let latest = null;
        for (const [speechSequenceId, bubble] of partialTranscriptBubbles) {
            if (!bubble.isConnected) {
                partialTranscriptBubbles.delete(speechSequenceId);
                continue;
            }
            if (!latest || speechSequenceId > latest.speechSequenceId) {
                latest = { speechSequenceId, bubble };
            }
        }
        return latest;
    }

    function appendSystem(message) {
        appendMessage("system", message);
    }

    function appendAssistantDelta(message) {
        if (!activeAssistantMessage) {
            activeAssistantMessage = appendMessage("assistant", "");
        }
        activeAssistantMessage.textContent += message;
        scrollToBottom();
        return activeAssistantMessage;
    }

    function removeAssistantDelta(bubble, message) {
        if (!bubble || !message) {
            return;
        }
        if (bubble.textContent.endsWith(message)) {
            bubble.textContent = bubble.textContent.slice(0, -message.length);
        }
        if (!bubble.textContent && bubble.parentElement) {
            if (activeAssistantMessage === bubble) {
                activeAssistantMessage = null;
            }
            bubble.parentElement.remove();
        }
        scrollToBottom();
    }

    function updateMicrophoneButton(recording) {
        micToggle.disabled = false;
        micToggle.classList.toggle("recording", recording);
        micToggle.setAttribute("aria-label", recording ? "マイク停止" : "マイク開始");
        micToggle.title = recording ? "マイク停止" : "マイク開始";
    }

    /** スマートフォン向け全画面表示を開始または解除する。 */
    async function toggleFullscreen() {
        try {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            } else {
                appendSystem("このブラウザは全画面表示に対応していません");
            }
        } catch (error) {
            appendSystem(`全画面表示を開始できませんでした: ${error.message}`);
        }
    }

    /** 全画面状態に応じて操作ボタンの表示内容を更新する。 */
    function updateFullscreenButton() {
        const active = Boolean(document.fullscreenElement);
        fullscreenToggle.textContent = active ? "解除" : "⛶";
        fullscreenToggle.setAttribute("aria-label", active ? "全画面解除" : "全画面表示");
        fullscreenToggle.title = active ? "全画面解除" : "全画面表示";
    }

    function updateStatusDisplay(status) {
        speechState.dataset.state = status.displayState;
        speechState.classList.toggle("active", status.active);
        speechStateText.textContent = status.displayText;
        speechState.title = status.displayState;
    }

    function facePresenceText(payload) {
        if (payload.state === "person-left") {
            return "だれもいなくなりました";
        }
        const name = (payload.personName || "").trim();
        if( name ) {
            return `${name}さんがきました`;
        } else {
            return 'だれか来ました';
        }
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            response.scrollTop = response.scrollHeight;
            requestAnimationFrame(() => {
                response.scrollTop = response.scrollHeight;
            });
        });
    }

    function sessionLabel() {
        return `${groupInput.value}/${sessionId}`;
    }
</script>
</body>
</html>
