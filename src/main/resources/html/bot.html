<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>顔認識会話bot</title>
    <link rel="stylesheet" href="/css/chat-common.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #6fa878;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            transition: background-color 400ms linear;
        }

        body.person-present {
            background: #e6e6e6;
            transition-duration: 300ms;
        }

        main {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            height: 100vh;
            overflow: hidden;
            padding: 18px;
        }

        .topbar {
            align-items: center;
            display: flex;
            gap: 10px;
            justify-content: space-between;
            z-index: 2;
        }

        .status-group {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        select,
        button {
            font: inherit;
        }

        select,
        .bot-button {
            background: #07110b;
            border: 1px solid #25472d;
            border-radius: 8px;
            color: #91c99a;
            height: 36px;
            padding: 0 12px;
        }

        .bot-button {
            cursor: pointer;
            font-weight: 700;
        }

        .bot-button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .presence {
            border: 1px solid #25472d;
            border-radius: 999px;
            color: #91c99a;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 10px;
        }

        .settings-button {
            background: #07110b;
            border: 1px solid #25472d;
            border-radius: 8px;
            color: #91c99a;
            height: 36px;
            padding: 0;
            width: 36px;
        }

        .settings-button svg {
            height: 19px;
            width: 19px;
        }

        .stage {
            align-items: center;
            display: grid;
            justify-items: center;
            min-height: 0;
            position: relative;
        }

        .face {
            height: min(56vw, 440px);
            width: min(78vw, 680px);
        }

        .face-eye-open-parts,
        .face-eye-60-parts,
        .face-eye-30-parts,
        .face-eye-closed-parts,
        .mouth,
        .mouth-smile,
        .mouth-closed {
            opacity: 0;
            transition: opacity 120ms ease;
        }

        .face.awake .face-awake-parts {
            opacity: 1;
        }

        .face.awake .mouth {
            opacity: 1;
        }

        .face.eyes-opening .face-eye-open-parts {
            animation: open-eye-open 200ms linear forwards;
        }

        .face.eyes-opening .face-eye-60-parts {
            animation: open-eye-60 200ms linear forwards;
        }

        .face.eyes-opening .face-eye-30-parts {
            animation: open-eye-30 200ms linear forwards;
        }

        .face.eyes-opening .face-eye-closed-parts {
            animation: open-eye-closed 200ms linear forwards;
        }

        .face.smile .mouth {
            opacity: 0;
        }

        .face.smile .mouth-smile {
            opacity: 1;
        }

        .face.blink .face-eye-open-parts {
            animation: blink-eye-open 320ms linear forwards;
        }

        .face.blink .face-eye-60-parts {
            animation: blink-eye-60 320ms linear forwards;
        }

        .face.blink .face-eye-30-parts {
            animation: blink-eye-30 320ms linear forwards;
        }

        .face.blink .face-eye-closed-parts {
            animation: blink-eye-closed 320ms linear forwards;
        }

        @keyframes open-eye-open {
            0%, 74.99% {
                opacity: 0;
            }
            75%, 100% {
                opacity: 1;
            }
        }

        @keyframes open-eye-60 {
            0%, 49.99%, 75%, 100% {
                opacity: 0;
            }
            50%, 74.99% {
                opacity: 1;
            }
        }

        @keyframes open-eye-30 {
            0%, 24.99%, 50%, 100% {
                opacity: 0;
            }
            25%, 49.99% {
                opacity: 1;
            }
        }

        @keyframes open-eye-closed {
            0%, 24.99% {
                opacity: 1;
            }
            25%, 100% {
                opacity: 0;
            }
        }

        @keyframes blink-eye-open {
            0%, 74.99% {
                opacity: 0;
            }
            75%, 100% {
                opacity: 1;
            }
        }

        @keyframes blink-eye-60 {
            0%, 49.99%, 75%, 100% {
                opacity: 0;
            }
            50%, 74.99% {
                opacity: 1;
            }
        }

        @keyframes blink-eye-30 {
            0%, 24.99%, 50%, 100% {
                opacity: 0;
            }
            25%, 49.99% {
                opacity: 1;
            }
        }

        @keyframes blink-eye-closed {
            0%, 24.99% {
                opacity: 1;
            }
            25%, 100% {
                opacity: 0;
            }
        }

        .mouth.speaking {
            animation: mouth-talk 300ms steps(2, end) infinite;
        }

        @keyframes mouth-talk {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(16px);
            }
            100% {
                transform: translateY(0);
            }
        }

        .camera-debug {
            background: #030806;
            border: 1px solid #25472d;
            border-radius: 8px;
            bottom: 18px;
            display: grid;
            gap: 6px;
            padding: 8px;
            position: absolute;
            right: 0;
            width: 220px;
        }

        .camera-wrap {
            aspect-ratio: 16 / 9;
            background: #000000;
            overflow: hidden;
            position: relative;
        }

        video,
        canvas {
            display: block;
            height: 100%;
            inset: 0;
            object-fit: cover;
            position: absolute;
            width: 100%;
        }

        canvas {
            pointer-events: none;
        }

        .debug-text {
            color: #91c99a;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .subtitle {
            align-items: end;
            display: grid;
            justify-items: center;
            min-height: 82px;
            padding-bottom: 18px;
        }

        .subtitle-text {
            background: rgba(0, 0, 0, 0.58);
            border: 1px solid #25472d;
            border-radius: 8px;
            color: #91c99a;
            display: -webkit-box;
            font-size: clamp(18px, 2.6vw, 28px);
            line-height: 1.45;
            max-width: min(920px, 94vw);
            min-height: 0;
            overflow: hidden;
            padding: 10px 14px;
            text-align: center;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .subtitle-text:empty {
            border-color: transparent;
            padding: 0;
        }

        .speech-state {
            background: #07110b;
            border-color: #25472d;
            color: #91c99a;
        }

        @media (max-width: 720px) {
            main {
                padding: 12px;
            }

            .topbar {
                align-items: stretch;
                flex-direction: column;
            }

            .camera-debug {
                bottom: 0;
                width: 168px;
            }

            .face {
                height: 54vw;
                width: 88vw;
            }
        }
    </style>
</head>
<body>
<main>
    <header class="topbar">
        <div class="status-group">
            <button id="start-bot" class="bot-button" type="button">開始</button>
            <select id="group" name="group">
                <option value="group-1">group-1</option>
                <option value="group-2">group-2</option>
                <option value="group-3">group-3</option>
            </select>
            <span id="speech-state" class="speech-state" data-state="UNDETECTED" title="IDLE">
                <span class="state-dot"></span>
                <span id="speech-state-text">IDLE</span>
            </span>
        </div>
        <div class="status-group">
            <span id="presence" class="presence">no person</span>
            <button id="open-settings" class="settings-button" type="button" aria-label="設定" title="設定">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.3 2.3-.06-.06A1.65 1.65 0 0 0 15.6 18a1.65 1.65 0 0 0-1 1.51V20h-3.2v-.09A1.65 1.65 0 0 0 10.4 18a1.65 1.65 0 0 0-1.82.33l-.06.06-2.3-2.3.06-.06A1.65 1.65 0 0 0 6 14.2a1.65 1.65 0 0 0-1.51-1H4.4V10h.09A1.65 1.65 0 0 0 6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06 2.3-2.3.06.06A1.65 1.65 0 0 0 9.8 5.2h.01A1.65 1.65 0 0 0 10.8 3.7V3.6H14v.1A1.65 1.65 0 0 0 15 5.2a1.65 1.65 0 0 0 1.82-.33l.06-.06 2.3 2.3-.06.06A1.65 1.65 0 0 0 18.8 9v.01a1.65 1.65 0 0 0 1.51 1H20.4v3.2h-.09A1.65 1.65 0 0 0 19.4 15z"></path></svg>
            </button>
        </div>
    </header>

    <section class="stage" aria-label="AI表情">
        <svg id="face" class="face" role="img" aria-labelledby="face-title"></svg>
        <section class="camera-debug" aria-label="カメラプレビュー">
            <div class="camera-wrap">
                <video id="camera" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
            </div>
            <div id="debug-text" class="debug-text">model: loading / camera: stopped</div>
        </section>
    </section>

    <section class="subtitle" aria-live="polite">
        <div id="subtitle" class="subtitle-text"></div>
    </section>
</main>

<script type="module">
    import * as faceapi from "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.esm.js";
    import { ChatAudio } from "/js/chat-audio.js";
    import { ChatEvents } from "/js/chat-events.js";
    import { drawFace } from "/js/face.js";

    const modelUrl = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
    const sessionId = crypto.randomUUID();
    const groupInput = document.getElementById("group");
    const openSettings = document.getElementById("open-settings");
    const startBot = document.getElementById("start-bot");
    const speechState = document.getElementById("speech-state");
    const speechStateText = document.getElementById("speech-state-text");
    const presence = document.getElementById("presence");
    const face = document.getElementById("face");
    const { mouth } = drawFace(face);
    const subtitle = document.getElementById("subtitle");
    const video = document.getElementById("camera");
    const overlay = document.getElementById("overlay");
    const overlayContext = overlay.getContext("2d");
    const debugText = document.getElementById("debug-text");
    const cropCanvas = document.createElement("canvas");
    const cropContext = cropCanvas.getContext("2d");
    const descriptorCanvas = document.createElement("canvas");
    const descriptorContext = descriptorCanvas.getContext("2d");

    let events = null;
    let stream = null;
    let faceTimer = 0;
    let botRunning = false;
    let modelsReady = false;
    let detecting = false;
    let eventSequence = 0;
    let personPresent = false;
    let faceAnimationSequence = 0;
    let subtitleClearTimer = 0;
    let trackSequence = 0;
    let lastFaceProcessAt = 0;
    let vadDeferredAt = 0;
    let skipNextFaceProcess = false;
    let faceLoadLevel = 0;
    let overloadCount = 0;
    let previousOverlaySnapshot = null;
    const faceProcessDurations = [];
    const faceTracks = new Map();
    const overlayBoxTolerancePx = 8;
    const overlaySizeToleranceRatio = 0.06;
    const faceLoadProfiles = [
        { periodMs: 250, inputSize: 416, descriptorIntervalMs: 1000 },
        { periodMs: 500, inputSize: 320, descriptorIntervalMs: 1000 },
        { periodMs: 1000, inputSize: 224, descriptorIntervalMs: 2000 },
        { periodMs: 2000, inputSize: 160, descriptorIntervalMs: 4000 },
    ];

    const selectedGroup = new URLSearchParams(location.search).get("group");
    if ([...groupInput.options].some((option) => option.value === selectedGroup)) {
        groupInput.value = selectedGroup;
    }
    openSettings.addEventListener("click", () => {
        location.href = `/settings.html?group=${encodeURIComponent(groupInput.value)}`;
    });

    const audio = new ChatAudio({
        group: () => groupInput.value,
        sessionId,
        clientLog: (event, fields) => events?.clientLog(event, fields),
        onSystem: (message) => setSubtitle(message, 2500),
        onSpeechStateDisplay: updateStatusDisplay,
        onAssistantText: (text) => {
            appendSubtitle(text);
            return { textContent: subtitle.textContent, parentElement: subtitle.parentElement };
        },
        onAssistantTextRemove: () => {},
        onAssistantSubtitle: () => {},
        onAssistantSubtitleDone: () => clearSubtitleSoon(),
        onMicStatus: updateDebugText,
        onMicRecording: () => {}
    });

    connectEvents();
    loadModels();

    startBot.addEventListener("click", async () => {
        if (botRunning) {
            stopBot();
            return;
        }
        await startBotSession();
    });
    groupInput.addEventListener("change", connectEvents);
    document.addEventListener("pointerdown", () => audio.preparePlayback(), { once: true });
    document.addEventListener("keydown", () => audio.preparePlayback(), { once: true });

    function connectEvents() {
        if (events) {
            events.close();
        }
        events = new ChatEvents({
            group: () => groupInput.value,
            sessionId,
            statusFields: () => audio.statusFields(),
            onSystem: (message) => setSubtitle(message, 2500),
            onUserMessage: (message) => setSubtitle(message, 0),
            onMessage: (message) => setSubtitle(message, 0),
            onMessageDone: clearSubtitleSoon,
            onTranscriptPartial: (payload) => setSubtitle(payload.text || "", 0),
            onAssistantAudioChunk: (payload) => audio.queueAudioDelta(payload),
            onAudioControl: (payload) => audio.handleAudioControl(payload),
            onSpeechState: (payload) => audio.updateSpeechState(payload.currentState || "UNDETECTED"),
            onAssistantState: (payload) => {
                audio.updateAssistantState(payload.state || "IDLE");
                mouth.classList.toggle("speaking", payload.state === "TTS");
            },
            onFacePresence: handleFacePresence
        });
        events.connect();
    }

    async function startBotSession() {
        startBot.disabled = true;
        try {
            botRunning = true;
            await audio.preparePlayback();
            await startCamera();
            startBot.textContent = "停止";
        } catch (error) {
            botRunning = false;
            updateDebugText(`camera error: ${error.message}`);
            stopCamera();
            resetFaceState();
        } finally {
            startBot.disabled = false;
        }
    }

    function stopBot() {
        startBot.disabled = true;
        botRunning = false;
        for (const track of faceTracks.values()) {
            if (track.entered) {
                sendPersonLeft(track);
            }
        }
        markAllPeopleLeft();
        resetFaceState();
        stopCamera();
        if (audio.isMicrophoneActive()) {
            audio.stopMicrophone();
        }
        startBot.textContent = "開始";
        startBot.disabled = false;
    }

    async function loadModels() {
        try {
            updateDebugText("model: loading / camera: stopped");
            await faceapi.tf.setBackend("webgl");
            await faceapi.tf.ready();
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl),
                faceapi.nets.faceLandmark68Net.loadFromUri(modelUrl),
                faceapi.nets.faceRecognitionNet.loadFromUri(modelUrl),
            ]);
            modelsReady = true;
            updateDebugText("model: ready / camera: stopped");
        } catch (error) {
            updateDebugText(`model error: ${error.message}`);
        }
    }

    async function startCamera() {
        if (stream) {
            return;
        }
        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: 1,
                sampleRate: { ideal: 16000 },
                echoCancellation: true,
                echoCancellationType: "system",
                noiseSuppression: true,
                autoGainControl: false,
            },
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 },
            },
        });
        audio.setStandbyMicrophone(stream);
        video.srcObject = stream;
        await video.play();
        resizeOverlay();
        window.addEventListener("resize", resizeOverlay);
        lastFaceProcessAt = 0;
        scheduleFaceProcess();
        updateDebugText("model: ready / camera: running");
    }

    function stopCamera() {
        if (faceTimer) {
            window.clearInterval(faceTimer);
            faceTimer = 0;
        }
        window.removeEventListener("resize", resizeOverlay);
        if (stream) {
            audio.releaseStandbyMicrophone();
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
        }
        video.pause();
        video.srcObject = null;
        detecting = false;
        lastFaceProcessAt = 0;
        vadDeferredAt = 0;
        skipNextFaceProcess = false;
        faceTracks.clear();
        previousOverlaySnapshot = null;
        overlayContext.clearRect(0, 0, overlay.width, overlay.height);
        updateDebugText(modelsReady ? "model: ready / camera: stopped" : "model: loading / camera: stopped");
    }

    function scheduleFaceProcess() {
        if (!botRunning || !stream) {
            return;
        }
        const delay = Math.max(0, faceLoadProfiles[faceLoadLevel].periodMs - (performance.now() - lastFaceProcessAt));
        faceTimer = window.setTimeout(async () => {
            await processCameraFrame();
            scheduleFaceProcess();
        }, delay);
    }

    async function processCameraFrame() {
        if (!botRunning || !modelsReady || detecting || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
            return;
        }
        const now = performance.now();
        if (audio.isSpeechActive()) {
            vadDeferredAt ||= now;
            if (now - vadDeferredAt < 1000) {
                lastFaceProcessAt = now;
                return;
            }
        } else {
            vadDeferredAt = 0;
        }
        if (skipNextFaceProcess) {
            skipNextFaceProcess = false;
            lastFaceProcessAt = now;
            return;
        }
        detecting = true;
        lastFaceProcessAt = now;
        try {
            await detectFaces(now);
        } finally {
            detecting = false;
            recordFaceProcessDuration(performance.now() - now);
        }
    }

    async function detectFaces(now) {
        const overlaySize = resizeOverlay();
        const profile = faceLoadProfiles[faceLoadLevel];
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: profile.inputSize, scoreThreshold: 0.5 });
        const rawDetections = await faceapi.detectAllFaces(video, options);
        if (!botRunning) {
            return;
        }
        const detections = rawDetections.map((detection) => ({ detection, box: detection.box, score: detection.score }));
        const assignments = associateTracks(detections, now);
        for (const { track, detection, isNew } of assignments) {
            updateTrack(track, detection, now);
            if (track.farFrames >= 12) {
                faceTracks.delete(track.trackId);
                if (track.entered) {
                    sendPersonLeft(track);
                }
                continue;
            }
            if (isNew || shouldRefreshDescriptor(track, profile, now)) {
                await updateTrackDescriptor(track, detection, options, now);
            }
            await sendTrackEventIfNeeded(track, detection, now);
        }
        expireUnmatchedTracks(assignments, now);
        drawTrackedFaces(overlaySize, now);
        updateFaceDebug(detections.length);
    }

    function associateTracks(detections, now) {
        const candidates = [];
        const unmatchedTrackIds = new Set(faceTracks.keys());
        const unmatchedDetectionIndexes = new Set(detections.map((_, index) => index));
        for (const track of faceTracks.values()) {
            for (const [index, detection] of detections.entries()) {
                const candidate = associationCandidate(track, detection);
                if (candidate) {
                    candidates.push({ track, detection, index, cost: candidate.cost });
                }
            }
        }
        candidates.sort((left, right) => left.cost - right.cost);
        const assignments = [];
        for (const candidate of candidates) {
            if (!unmatchedTrackIds.has(candidate.track.trackId) || !unmatchedDetectionIndexes.has(candidate.index)) {
                continue;
            }
            unmatchedTrackIds.delete(candidate.track.trackId);
            unmatchedDetectionIndexes.delete(candidate.index);
            assignments.push({ track: candidate.track, detection: candidate.detection, isNew: false });
        }
        for (const index of unmatchedDetectionIndexes) {
            const track = createFaceTrack(detections[index], now);
            faceTracks.set(track.trackId, track);
            assignments.push({ track, detection: detections[index], isNew: true });
        }
        for (const trackId of unmatchedTrackIds) {
            faceTracks.get(trackId).missedFrames += 1;
        }
        return assignments;
    }

    function associationCandidate(track, detection) {
        const predicted = predictedBox(track);
        const centerDistance = boxCenterDistance(predicted, detection.box);
        const diagonal = Math.hypot(video.videoWidth, video.videoHeight);
        const overlap = iou(predicted, detection.box);
        if (centerDistance / diagonal > 0.15 && overlap < 0.1) {
            return null;
        }
        const distance = track.descriptor && detection.descriptor
            ? descriptorDistance(track.descriptor, detection.descriptor)
            : 0;
        if (distance > 0.45) {
            return null;
        }
        const sizeCost = Math.abs(boxArea(track.detection.box) - boxArea(detection.box)) / Math.max(1, boxArea(track.detection.box));
        return { cost: centerDistance / diagonal + sizeCost + distance };
    }

    function createFaceTrack(detection, now) {
        return {
            trackId: `track-${++trackSequence}`,
            // face-api の検出結果を保持し、プレビュー用矩形は face-api の座標変換で描画する。
            detection: detection.detection,
            descriptorBoxArea: 0,
            velocity: { x: 0, y: 0 },
            descriptor: null,
            lastSeenAt: now,
            lastDescriptorAt: 0,
            missedFrames: 0,
            matchedFrames: 1,
            farFrames: 0,
            confirmed: false,
            entered: false,
            lastEventAt: 0,
            personId: null,
            sampleId: null,
        };
    }

    function updateTrack(track, detection, now) {
        const previousCenter = boxCenter(track.detection.box);
        const nextCenter = boxCenter(detection.box);
        const elapsed = Math.max(1, now - track.lastSeenAt);
        track.velocity = { x: (nextCenter.x - previousCenter.x) / elapsed, y: (nextCenter.y - previousCenter.y) / elapsed };
        track.detection = detection.detection;
        track.lastSeenAt = now;
        track.missedFrames = 0;
        track.matchedFrames += 1;
        track.confirmed = track.matchedFrames >= 2;
        track.farFrames = detection.box.width / video.videoWidth < 0.15 ? track.farFrames + 1 : 0;
    }

    function predictedBox(track) {
        const elapsed = Math.max(0, performance.now() - track.lastSeenAt);
        const box = track.detection.box;
        return { ...box, x: box.x + track.velocity.x * elapsed, y: box.y + track.velocity.y * elapsed };
    }

    function shouldRefreshDescriptor(track, profile, now) {
        return !track.descriptor
            || now - track.lastDescriptorAt >= profile.descriptorIntervalMs
            || Math.abs(boxArea(track.detection.box) - track.descriptorBoxArea) / Math.max(1, track.descriptorBoxArea) >= 0.5;
    }

    async function updateTrackDescriptor(track, detection, options, now) {
        const descriptorDetection = await detectDescriptor(detection.box, options);
        if (!descriptorDetection || !botRunning) {
            return;
        }
        track.descriptor = Float32Array.from(descriptorDetection.descriptor);
        track.lastDescriptorAt = now;
        track.descriptorBoxArea = boxArea(detection.box);
    }

    async function detectDescriptor(box, options) {
        const margin = box.width * 0.3;
        const sx = Math.max(0, box.x - margin);
        const sy = Math.max(0, box.y - margin);
        const sw = Math.min(video.videoWidth - sx, box.width + margin * 2);
        const sh = Math.min(video.videoHeight - sy, box.height + margin * 2);
        descriptorCanvas.width = Math.max(1, Math.round(sw));
        descriptorCanvas.height = Math.max(1, Math.round(sh));
        descriptorContext.drawImage(video, sx, sy, sw, sh, 0, 0, descriptorCanvas.width, descriptorCanvas.height);
        return faceapi.detectSingleFace(descriptorCanvas, options).withFaceLandmarks().withFaceDescriptor();
    }

    async function sendTrackEventIfNeeded(track, detection, now) {
        const widthRatio = detection.box.width / video.videoWidth;
        const areaRatio = boxArea(detection.box) / (video.videoWidth * video.videoHeight);
        if (!track.confirmed || !track.descriptor || widthRatio < 0.20) {
            return;
        }
        if (!track.entered) {
            track.entered = true;
            track.lastEventAt = now;
            await sendFaceEvent("person-entered", track, detection, widthRatio, areaRatio);
            activatePersonPresence();
        } else if (now - track.lastEventAt >= 8000) {
            track.lastEventAt = now;
            await sendFaceEvent("person-updated", track, detection, widthRatio, areaRatio);
        }
    }

    function expireUnmatchedTracks(assignments, now) {
        const matchedTrackIds = new Set(assignments.map(({ track }) => track.trackId));
        for (const track of [...faceTracks.values()]) {
            if (matchedTrackIds.has(track.trackId)) {
                continue;
            }
            if (now - track.lastSeenAt >= 9000 || track.farFrames >= 12) {
                faceTracks.delete(track.trackId);
                if (track.entered) {
                    sendPersonLeft(track);
                }
            }
        }
    }

    function drawTrackedFaces(overlaySize, now) {
        const snapshot = createOverlaySnapshot(overlaySize, now);
        if (isSameOverlaySnapshot(previousOverlaySnapshot, snapshot)) {
            return;
        }

        overlayContext.clearRect(0, 0, overlaySize.width, overlaySize.height);
        for (const item of snapshot.items) {
            overlayContext.strokeStyle = item.strokeStyle;
            overlayContext.lineWidth = item.lineWidth;
            overlayContext.setLineDash(item.lineDash);
            overlayContext.strokeRect(item.box.x, item.box.y, item.box.width, item.box.height);
            overlayContext.fillStyle = item.strokeStyle;
            overlayContext.fillText(item.label, item.box.x, Math.max(12, item.box.y - 4));
        }
        overlayContext.setLineDash([]);
        previousOverlaySnapshot = snapshot;
    }

    function createOverlaySnapshot(overlaySize, now) {
        return {
            width: overlaySize.width,
            height: overlaySize.height,
            items: [...faceTracks.values()].map((track) => {
                const resized = faceapi.resizeResults(track.detection, overlaySize);
                const descriptorUpdatedThisFrame = track.lastDescriptorAt === now;
                return {
                    trackId: track.trackId,
                    label: track.trackId,
                    box: resized.box,
                    strokeStyle: track.entered ? "#315f39" : "#666666",
                    lineWidth: descriptorUpdatedThisFrame ? 3 : 1,
                    lineDash: track.descriptor ? [] : [6, 4],
                };
            }),
        };
    }

    function isSameOverlaySnapshot(previous, next) {
        if (!previous
            || previous.width !== next.width
            || previous.height !== next.height
            || previous.items.length !== next.items.length) {
            return false;
        }
        for (let index = 0; index < next.items.length; index += 1) {
            if (!isSameOverlayItem(previous.items[index], next.items[index])) {
                return false;
            }
        }
        return true;
    }

    function isSameOverlayItem(previous, next) {
        return previous.trackId === next.trackId
            && previous.label === next.label
            && previous.strokeStyle === next.strokeStyle
            && previous.lineWidth === next.lineWidth
            && isSameLineDash(previous.lineDash, next.lineDash)
            && isSameOverlayBox(previous.box, next.box);
    }

    function isSameLineDash(previous, next) {
        return previous.length === next.length && previous.every((value, index) => value === next[index]);
    }

    function isSameOverlayBox(previous, next) {
        return Math.abs(previous.x - next.x) <= overlayBoxTolerancePx
            && Math.abs(previous.y - next.y) <= overlayBoxTolerancePx
            && Math.abs(previous.width - next.width) <= Math.max(overlayBoxTolerancePx, previous.width * overlaySizeToleranceRatio)
            && Math.abs(previous.height - next.height) <= Math.max(overlayBoxTolerancePx, previous.height * overlaySizeToleranceRatio);
    }

    function activatePersonPresence() {
        if (personPresent || !botRunning) {
            return;
        }
        personPresent = true;
        const animationSequence = ++faceAnimationSequence;
        document.body.classList.add("person-present");
        face.classList.remove("awake", "blink", "eyes-opening");
        runPresenceAnimation(animationSequence);
    }

    async function runPresenceAnimation(animationSequence) {
        await wait(300);
        if (animationSequence !== faceAnimationSequence || !personPresent || !botRunning) {
            return;
        }
        face.classList.add("eyes-opening");
        await wait(200);
        if (animationSequence !== faceAnimationSequence || !personPresent || !botRunning) {
            return;
        }
        face.classList.remove("eyes-opening");
        face.classList.add("awake");
        await wait(200);
        if (animationSequence !== faceAnimationSequence || !personPresent || !botRunning) {
            return;
        }
        if (!audio.isMicrophoneActive()) {
            await audio.startMicrophone();
        }
        if (animationSequence !== faceAnimationSequence || !personPresent || !botRunning) {
            return;
        }
        await blinkTwice(animationSequence);
    }

    async function sendFaceEvent(eventType, track, detection, faceWidthRatio, faceAreaRatio) {
        const imageDataUrl = cropFaceImage(detection.box);
        const payload = {
            eventType,
            eventId: `${Date.now()}-${++eventSequence}`,
            clientTimestamp: new Date().toISOString(),
            trackId: track.trackId,
            faceWidthRatio,
            faceAreaRatio,
            detectionScore: detection.score,
            descriptor: Array.from(track.descriptor),
            imageDataUrl,
        };
        const response = await fetch(`/face/event?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
            method: "POST",
            headers: {"Content-Type": "application/json; charset=utf-8"},
            body: JSON.stringify(payload),
        });
        if (response.ok) {
            const result = await response.json();
            track.personId = result.known ? result.personId : null;
            track.sampleId = result.sampleId || null;
            presence.textContent = `${faceTracks.size} person(s) / ${result.known ? result.personName : "unknown"}`;
        }
    }

    function cropFaceImage(box) {
        const margin = box.width * 0.3;
        const sx = Math.max(0, box.x - margin);
        const sy = Math.max(0, box.y - margin);
        const sw = Math.min(video.videoWidth - sx, box.width + margin * 2);
        const sh = Math.min(video.videoHeight - sy, box.height + margin * 2);
        const scale = Math.min(320 / sw, 320 / sh, 1);
        cropCanvas.width = Math.max(1, Math.round(sw * scale));
        cropCanvas.height = Math.max(1, Math.round(sh * scale));
        cropContext.drawImage(video, sx, sy, sw, sh, 0, 0, cropCanvas.width, cropCanvas.height);
        return cropCanvas.toDataURL("image/jpeg", 0.75);
    }

    function sendPersonLeft(track) {
        fetch(`/face/event?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
            method: "POST",
            headers: {"Content-Type": "application/json; charset=utf-8"},
            body: JSON.stringify({ eventType: "person-left", eventId: `${Date.now()}-${++eventSequence}`, clientTimestamp: new Date().toISOString(), trackId: track.trackId }),
        }).catch(() => {});
        if ([...faceTracks.values()].some((item) => item.entered)) {
            return;
        }
        markAllPeopleLeft();
    }

    function markAllPeopleLeft() {
        if (!personPresent) {
            return;
        }
        personPresent = false;
        const animationSequence = ++faceAnimationSequence;
        presence.textContent = "no person";
        document.body.classList.remove("person-present");
        if (audio.isMicrophoneActive()) {
            audio.stopMicrophone();
        }
        setTimeout(() => {
            if (animationSequence === faceAnimationSequence && !personPresent) {
                face.classList.remove("awake", "blink", "eyes-opening");
            }
        }, 400);
    }

    function resetFaceState() {
        personPresent = false;
        faceAnimationSequence += 1;
        faceTracks.clear();
        previousOverlaySnapshot = null;
        presence.textContent = "no person";
        document.body.classList.remove("person-present");
        face.classList.remove("awake", "blink", "eyes-opening");
    }

    function handleFacePresence(payload) {
        if (payload.state === "person-left") {
            if ([...faceTracks.values()].some((track) => track.entered)) {
                presence.textContent = `${[...faceTracks.values()].filter((track) => track.entered).length} person(s)`;
                return;
            }
            presence.textContent = "no person";
            setSubtitle("だれもいなくなりました", 1800);
            return;
        }
        presence.textContent = payload.known ? `${payload.personName} / ${Number(payload.distance || 0).toFixed(3)}` : "unknown person";
        if (payload.state === "person-entered") {
            const name = (payload.personName || "").trim();
            setSubtitle(name ? `${name}さんがきました` : "だれか来ました", 1800);
        }
    }

    function resizeOverlay() {
        const rect = video.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(rect.width * ratio));
        const height = Math.max(1, Math.round(rect.height * ratio));
        const sizeChanged = overlay.width !== width || overlay.height !== height;
        if (sizeChanged) {
            overlay.width = width;
            overlay.height = height;
            previousOverlaySnapshot = null;
        }
        overlay.style.width = `${rect.width}px`;
        overlay.style.height = `${rect.height}px`;
        overlayContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        return { width: rect.width, height: rect.height };
    }

    function updateStatusDisplay(status) {
        speechState.dataset.state = status.displayState;
        speechState.classList.toggle("active", status.active);
        speechStateText.textContent = status.displayText;
        speechState.title = status.displayState;
        mouth.classList.toggle("speaking", status.displayState === "TTS");
    }

    function appendSubtitle(text) {
        clearTimeout(subtitleClearTimer);
        subtitle.textContent += text;
    }

    function setSubtitle(text, clearMs) {
        clearTimeout(subtitleClearTimer);
        subtitle.textContent = text;
        if (clearMs > 0) {
            subtitleClearTimer = setTimeout(() => {
                subtitle.textContent = "";
            }, clearMs);
        }
    }

    function clearSubtitleSoon() {
        clearTimeout(subtitleClearTimer);
        subtitleClearTimer = setTimeout(() => {
            subtitle.textContent = "";
        }, 900);
    }

    async function blinkTwice(animationSequence) {
        await blinkOnce(animationSequence);
        await wait(160);
        await blinkOnce(animationSequence);
    }

    async function blinkOnce(animationSequence) {
        if (animationSequence !== faceAnimationSequence || !personPresent || !botRunning) {
            return;
        }
        face.classList.add("blink");
        await wait(320);
        if (animationSequence === faceAnimationSequence) {
            face.classList.remove("blink");
        }
    }

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function updateDebugText(message) {
        debugText.textContent = message;
    }

    function updateFaceDebug(faceCount) {
        const lines = [
            `face=${faceCount} load=${faceLoadLevel} avg=${average(faceProcessDurations, 10).toFixed(0)}ms`,
            ...[...faceTracks.values()].map((track) => `${track.trackId} ${track.sampleId || "none"}`),
        ];
        updateDebugText(lines.join("\n"));
    }

    function boxArea(box) {
        return box.width * box.height;
    }

    function boxCenter(box) {
        return { x: box.x + box.width / 2, y: box.y + box.height / 2 };
    }

    function boxCenterDistance(left, right) {
        const a = boxCenter(left);
        const b = boxCenter(right);
        return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function iou(left, right) {
        const overlapWidth = Math.max(0, Math.min(left.x + left.width, right.x + right.width) - Math.max(left.x, right.x));
        const overlapHeight = Math.max(0, Math.min(left.y + left.height, right.y + right.height) - Math.max(left.y, right.y));
        const overlap = overlapWidth * overlapHeight;
        return overlap / Math.max(1, boxArea(left) + boxArea(right) - overlap);
    }

    function descriptorDistance(left, right) {
        let sum = 0;
        for (let index = 0; index < left.length; index += 1) {
            const difference = left[index] - right[index];
            sum += difference * difference;
        }
        return Math.sqrt(sum);
    }

    function average(values, count) {
        const selected = values.slice(-count);
        return selected.length === 0 ? 0 : selected.reduce((sum, value) => sum + value, 0) / selected.length;
    }

    function recordFaceProcessDuration(duration) {
        faceProcessDurations.push(duration);
        if (faceProcessDurations.length > 20) {
            faceProcessDurations.shift();
        }
        const profile = faceLoadProfiles[faceLoadLevel];
        if (average(faceProcessDurations, 10) > profile.periodMs * 0.7) {
            overloadCount += 1;
            if (overloadCount >= 3 && faceLoadLevel < faceLoadProfiles.length - 1) {
                faceLoadLevel += 1;
                overloadCount = 0;
            }
        } else {
            overloadCount = 0;
        }
        if (faceLoadLevel > 0
            && average(faceProcessDurations, 20) < profile.periodMs * 0.35
            && audio.playbackScheduleGapMs() < 50) {
            faceLoadLevel -= 1;
            overloadCount = 0;
        }
        if (audio.playbackScheduleGapMs() > 100) {
            skipNextFaceProcess = true;
        }
    }
</script>
