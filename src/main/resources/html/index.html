<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>multimodal-llm-server</title>
    <style>
        body {
            color: #1b1f24;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            margin: 0;
        }

        main {
            box-sizing: border-box;
            display: grid;
            gap: 16px;
            margin: 0 auto;
            max-width: 840px;
            padding: 32px 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        form {
            display: grid;
            gap: 10px;
        }

        textarea {
            box-sizing: border-box;
            font: inherit;
            min-height: 120px;
            padding: 10px;
            resize: vertical;
            width: 100%;
        }

        button {
            justify-self: start;
            padding: 8px 14px;
        }

        pre {
            background: #f4f6f8;
            border: 1px solid #d8dee4;
            margin: 0;
            min-height: 180px;
            overflow: auto;
            padding: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<main>
    <h1>multimodal-llm-server</h1>
    <form id="chat-form">
        <select id="group" name="group">
            <option value="group-1">group-1</option>
            <option value="group-2">group-2</option>
            <option value="group-3">group-3</option>
        </select>
        <textarea id="message" name="message"></textarea>
        <button type="submit">Send</button>
    </form>
    <pre id="response"></pre>
</main>
<script>
    const sessionId = crypto.randomUUID();
    const groupInput = document.getElementById("group");
    const response = document.getElementById("response");
    let events = connect();

    groupInput.addEventListener("change", () => {
        events.close();
        response.textContent = "";
        events = connect();
    });


    document.getElementById("chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = document.getElementById("message").value;
        await fetch(`/chat/request?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
            method: "POST",
            headers: {"Content-Type": "text/plain; charset=utf-8"},
            body: message
        });
    });

    function connect() {
        const source = new EventSource(`/chat/connect?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`);

        source.addEventListener("system", (event) => {
            append(JSON.parse(event.data).message);
        });

        source.addEventListener("message", (event) => {
            append(JSON.parse(event.data).message);
        });

        return source;
    }

    function append(message) {
        response.textContent += `${message}\n`;
    }
</script>
</body>
</html>
