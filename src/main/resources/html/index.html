<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>multimodal-llm-server</title>
    <style>
        body {
            background: #f7f7f8;
            color: #1b1f24;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            margin: 0;
        }

        main {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0 auto;
            max-width: 920px;
            min-height: 0;
            padding: 18px 20px 20px;
        }

        .app-header {
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 14px;
            justify-content: space-between;
            padding: 0 0 14px;
        }

        .title {
            display: grid;
            gap: 2px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0;
        }

        .session {
            color: #64748b;
            font-size: 13px;
        }

        select,
        input,
        button {
            box-sizing: border-box;
            font: inherit;
        }

        select {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #111827;
            height: 36px;
            padding: 0 10px;
        }

        .chat-log {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 4px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant,
        .message-row.system {
            justify-content: flex-start;
        }

        .message {
            border: 1px solid transparent;
            border-radius: 14px;
            box-sizing: border-box;
            max-width: min(680px, 88%);
            overflow-wrap: anywhere;
            padding: 10px 13px;
            white-space: pre-wrap;
        }

        .message.user {
            background: #2563eb;
            color: #ffffff;
        }

        .message.user.partial {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a8a;
            opacity: 0.92;
        }

        .message.assistant {
            background: #ffffff;
            border-color: #e5e7eb;
            color: #111827;
        }

        .message.system {
            background: transparent;
            border-color: #d1d5db;
            color: #64748b;
            font-size: 13px;
        }

        .controls {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status {
            color: #57606a;
            font-size: 14px;
        }

        .sr-only {
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            height: 1px;
            overflow: hidden;
            position: absolute;
            white-space: nowrap;
            width: 1px;
        }

        .speech-state {
            align-items: center;
            background: #f8fafc;
            border: 1px solid #dbe3ed;
            border-radius: 999px;
            box-sizing: border-box;
            color: #475569;
            display: inline-flex;
            font-size: 13px;
            font-weight: 700;
            gap: 8px;
            height: 36px;
            justify-content: center;
            letter-spacing: 0;
            padding: 0 8px;
            width: 72px;
        }

        .speech-state .state-dot {
            background: #94a3b8;
            border-radius: 999px;
            height: 9px;
            position: relative;
            width: 9px;
        }

        .speech-state.active {
            background: #ecfdf5;
            border-color: #86efac;
            color: #14532d;
        }

        .speech-state.active .state-dot {
            animation: state-pulse 1.1s ease-out infinite;
            background: #16a34a;
        }

        .speech-state[data-state="TRAILING_SILENCE"] {
            background: #fffbeb;
            border-color: #fde68a;
            color: #713f12;
        }

        .speech-state[data-state="TRAILING_SILENCE"] .state-dot {
            background: #d97706;
        }

        .speech-state[data-state="TURN_DETECTING"] {
            background: #eff6ff;
            border-color: #93c5fd;
            color: #1e3a8a;
        }

        .speech-state[data-state="TURN_DETECTING"] .state-dot {
            animation: state-spin 0.9s linear infinite;
            background: conic-gradient(from 0deg, #2563eb 0deg, #2563eb 110deg, transparent 110deg);
            height: 14px;
            width: 14px;
        }

        .speech-state[data-state="TRANSCRIBING"] {
            background: #f5f3ff;
            border-color: #c4b5fd;
            color: #4c1d95;
        }

        .speech-state[data-state="TRANSCRIBING"] .state-dot {
            animation: state-pulse 0.72s ease-in-out infinite;
            background: #7c3aed;
        }

        .speech-state[data-state="LLM"] {
            background: #eef2ff;
            border-color: #a5b4fc;
            color: #3730a3;
        }

        .speech-state[data-state="LLM"] .state-dot {
            animation: state-pulse 0.8s ease-in-out infinite;
            background: #4f46e5;
        }

        .speech-state[data-state="TTS"] {
            background: #fff7ed;
            border-color: #fdba74;
            color: #9a3412;
        }

        .speech-state[data-state="TTS"] .state-dot {
            animation: state-pulse 0.8s ease-in-out infinite;
            background: #ea580c;
        }

        .icon-button {
            align-items: center;
            background: #ffffff;
            border-radius: 999px;
            display: inline-flex;
            height: 36px;
            justify-content: center;
            padding: 0;
            width: 36px;
        }

        .icon-button svg {
            height: 19px;
            pointer-events: none;
            width: 19px;
        }

        .icon-button.primary {
            background: #111827;
            border-color: #111827;
            color: #ffffff;
        }

        .icon-button.recording {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #b91c1c;
        }

        .composer {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
            display: grid;
            padding: 8px;
        }

        form {
            display: grid;
            align-items: center;
            gap: 6px;
            grid-template-columns: minmax(0, 1fr) 72px 36px 36px;
        }

        input {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            height: 36px;
            padding: 0 12px;
            width: 100%;
        }

        button {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            height: 36px;
            padding: 0 14px;
        }

        button[type="submit"] {
            background: #111827;
            border-color: #111827;
            color: #ffffff;
            font-weight: 700;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        @keyframes state-pulse {
            0% {
                box-shadow: 0 0 0 0 currentColor;
                opacity: 1;
            }
            70% {
                box-shadow: 0 0 0 8px transparent;
                opacity: 0.72;
            }
            100% {
                box-shadow: 0 0 0 0 transparent;
                opacity: 1;
            }
        }

        @keyframes state-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            main {
                padding: 14px 12px 14px;
            }

            .app-header {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .message {
                max-width: 94%;
            }

            form {
                gap: 5px;
                grid-template-columns: minmax(0, 1fr) 64px 34px 34px;
            }

            .speech-state {
                font-size: 12px;
                gap: 6px;
                height: 34px;
                width: 64px;
            }

            .icon-button {
                height: 34px;
                width: 34px;
            }

            .icon-button svg {
                height: 18px;
                width: 18px;
            }

            input {
                height: 34px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
<main>
    <header class="app-header">
        <div class="title">
            <h1>multimodal-llm-server</h1>
            <span id="session" class="session"></span>
        </div>
        <select id="group" name="group">
            <option value="group-1">group-1</option>
            <option value="group-2">group-2</option>
            <option value="group-3">group-3</option>
        </select>
    </header>
    <section id="response" class="chat-log" aria-live="polite"></section>
    <section class="composer">
        <form id="chat-form">
            <input id="message" name="message" autocomplete="off" placeholder="メッセージを入力">
            <span id="speech-state" class="speech-state" data-state="UNDETECTED" title="IDLE">
                <span class="state-dot"></span>
                <span id="speech-state-text">IDLE</span>
            </span>
            <button id="mic-toggle" class="icon-button" type="button" aria-label="マイク開始" title="マイク開始">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="2"></path>
                    <path d="M19 11a7 7 0 0 1-14 0M12 18v4M8 22h8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
                </svg>
            </button>
            <button class="icon-button primary" type="submit" aria-label="送信" title="送信">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle>
                    <path d="M12 16V8m0 0-4 4m4-4 4 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
            </button>
            <span id="mic-status" class="status sr-only">microphone stopped</span>
        </form>
    </section>
</main>
<script type="module">
    import createVADModule from "/tenvad/ten_vad.js";

    const sessionId = crypto.randomUUID();
    const groupInput = document.getElementById("group");
    const response = document.getElementById("response");
    const messageInput = document.getElementById("message");
    const session = document.getElementById("session");
    const micToggle = document.getElementById("mic-toggle");
    const micStatus = document.getElementById("mic-status");
    const speechState = document.getElementById("speech-state");
    const speechStateText = document.getElementById("speech-state-text");
    const targetSampleRate = 16000;
    const tenVadHopSamples = 256;
    const tenVadThreshold = 0.5;
    const pcmVadHeaderBytes = 32;
    const pcmVadContentType = "audio/pcm-vad; rate=16000; channels=1; format=s16le; vad-frame-samples=256";
    const sendSampleThreshold = tenVadHopSamples * 12;
    const localPauseVadThreshold = 50;
    const localPauseConsecutiveVadFrames = 3;
    const localResumeVadThreshold = 35;
    const localResumeSilenceVadFrames = 8;
    let events = null;
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let micProcessor = null;
    let resampler = null;
    let tenVadModule = null;
    let tenVadHandlePtr = 0;
    let tenVadHandle = 0;
    let tenVadAudioPtr = 0;
    let tenVadProbabilityPtr = 0;
    let tenVadFlagPtr = 0;
    let pendingSamples = [];
    let pendingSampleCount = 0;
    let pendingStartSampleIndex = 0;
    let clientMicSampleIndex = 0;
    let loudVadFrameCount = 0;
    let quietVadFrameCount = 0;
    let postQueue = Promise.resolve();
    let playbackContext = null;
    let queuedAudioDeltas = [];
    let currentPlayback = null;
    let pausedPlayback = null;
    let localVadPlaybackPaused = false;
    let serverSttPlaybackPaused = false;
    let speechDetectionState = "UNDETECTED";
    let assistantPipelineState = "IDLE";
    let activeAssistantTurnId = 0;
    let activeAssistantMessage = null;
    const partialTranscriptBubbles = new Map();
    let browserLogSequence = 0;
    const canceledAssistantTurnIds = new Set();
    session.textContent = sessionLabel();
    events = connect();

    groupInput.addEventListener("change", () => {
        events.close();
        response.replaceChildren();
        activeAssistantMessage = null;
        partialTranscriptBubbles.clear();
        session.textContent = sessionLabel();
        resetPlayback();
        clientLog("group-change", { detail: groupInput.value });
        events = connect();
    });


    document.getElementById("chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        await preparePlayback();
        const message = messageInput.value.trim();
        if (!message) {
            return;
        }
        messageInput.value = "";
        const request = await fetch(`/chat/request?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
            method: "POST",
            headers: {"Content-Type": "text/plain; charset=utf-8"},
            body: message
        });
        if (!request.ok) {
            const text = await request.text();
            appendSystem(text || `HTTP ${request.status}`);
        }
    });

    micToggle.addEventListener("click", toggleMicrophone);
    document.addEventListener("pointerdown", preparePlayback, { once: true });
    document.addEventListener("keydown", preparePlayback, { once: true });

    function connect() {
        const source = new EventSource(`/chat/connect?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`);
        clientLog("event-source-create");

        source.addEventListener("system", (event) => {
            appendSystem(JSON.parse(event.data).message);
        });

        source.addEventListener("user-message", (event) => {
            finalizePartialTranscript(JSON.parse(event.data).message);
            activeAssistantMessage = null;
        });

        source.addEventListener("message", (event) => {
            appendMessage("assistant", JSON.parse(event.data).message);
        });

        source.addEventListener("message-delta", (event) => {
            clientLog("message-delta-ignored");
        });

        source.addEventListener("message-done", () => {
            clientLog("message-done-received");
            activeAssistantMessage = null;
            scrollToBottom();
        });

        source.addEventListener("transcript-partial", (event) => {
            try {
                const payload = JSON.parse(JSON.parse(event.data).message);
                appendPartialTranscript(payload.speechSequenceId || 0, payload.text || "");
            } catch (error) {
                clientLog("transcript-partial-parse-error", { error: error.message });
            }
        });

        source.addEventListener("assistant-audio-chunk", (event) => {
            try {
                const payload = JSON.parse(JSON.parse(event.data).message);
                clientLog("assistant-audio-chunk-received", {
                    assistantTurnId: payload.assistantTurnId || 0,
                    chunkId: payload.chunkId || 0,
                    detail: `audioDeltas=${payload.audioDeltas ? payload.audioDeltas.length : 0};textChars=${payload.text ? payload.text.length : 0}`
                });
                queueAudioDelta(normalizeAssistantChunk(payload));
            } catch (error) {
                clientLog("assistant-audio-chunk-parse-error", { error: error.message });
                appendSystem(`assistant audio chunk parse error: ${error.message}`);
            }
        });

        source.addEventListener("audio-delta", (event) => {
            clientLog("legacy-audio-delta-ignored");
        });

        source.addEventListener("audio-control", (event) => {
            try {
                const payload = JSON.parse(JSON.parse(event.data).message);
                clientLog("audio-control-received", {
                    assistantTurnId: payload.assistantTurnId || 0,
                    detail: `action=${payload.action || ""};reason=${payload.reason || ""};speechSequenceId=${payload.speechSequenceId || 0}`
                });
                handleAudioControl(payload);
            } catch (error) {
                clientLog("audio-control-parse-error", { error: error.message });
                appendSystem(`audio control parse error: ${error.message}`);
            }
        });

        source.addEventListener("speech-state", (event) => {
            try {
                const payload = JSON.parse(JSON.parse(event.data).message);
                updateSpeechState(payload.currentState || "UNDETECTED");
            } catch (error) {
                clientLog("speech-state-parse-error", { error: error.message });
            }
        });

        source.addEventListener("assistant-state", (event) => {
            try {
                const payload = JSON.parse(JSON.parse(event.data).message);
                updateAssistantState(payload.state || "IDLE");
            } catch (error) {
                clientLog("assistant-state-parse-error", { error: error.message });
            }
        });

        return source;
    }

    function appendMessage(role, message) {
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        const bubble = document.createElement("div");
        bubble.className = `message ${role}`;
        bubble.textContent = message;
        row.append(bubble);
        response.append(row);
        scrollToBottom();
        return bubble;
    }

    function appendPartialTranscript(speechSequenceId, message) {
        if (!speechSequenceId || !message.trim()) {
            return;
        }
        for (const id of partialTranscriptBubbles.keys()) {
            if (id < speechSequenceId) {
                partialTranscriptBubbles.delete(id);
            }
        }
        let bubble = partialTranscriptBubbles.get(speechSequenceId);
        if (!bubble || !bubble.isConnected) {
            bubble = appendMessage("user", "");
            bubble.classList.add("partial");
            partialTranscriptBubbles.set(speechSequenceId, bubble);
        }
        bubble.textContent = message;
        scrollToBottom();
    }

    function finalizePartialTranscript(message) {
        const latest = latestPartialTranscriptBubble();
        if (!latest) {
            appendMessage("user", message);
            return;
        }
        latest.bubble.textContent = message;
        latest.bubble.className = "message user";
        partialTranscriptBubbles.delete(latest.speechSequenceId);
        scrollToBottom();
    }

    function latestPartialTranscriptBubble() {
        let latest = null;
        for (const [speechSequenceId, bubble] of partialTranscriptBubbles) {
            if (!bubble.isConnected) {
                partialTranscriptBubbles.delete(speechSequenceId);
                continue;
            }
            if (!latest || speechSequenceId > latest.speechSequenceId) {
                latest = { speechSequenceId, bubble };
            }
        }
        return latest;
    }

    function appendSystem(message) {
        appendMessage("system", message);
    }

    function appendAssistantDelta(message) {
        if (!activeAssistantMessage) {
            activeAssistantMessage = appendMessage("assistant", "");
        }
        activeAssistantMessage.textContent += message;
        scrollToBottom();
        return activeAssistantMessage;
    }

    function removeAssistantDelta(bubble, message) {
        if (!bubble || !message) {
            return;
        }
        if (bubble.textContent.endsWith(message)) {
            bubble.textContent = bubble.textContent.slice(0, -message.length);
        }
        if (!bubble.textContent && bubble.parentElement) {
            if (activeAssistantMessage === bubble) {
                activeAssistantMessage = null;
            }
            bubble.parentElement.remove();
        }
        scrollToBottom();
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            response.scrollTop = response.scrollHeight;
            requestAnimationFrame(() => {
                response.scrollTop = response.scrollHeight;
            });
        });
    }

    function sessionLabel() {
        return `${groupInput.value}/${sessionId}`;
    }

    function clientLog(event, fields = {}) {
        const payload = {
            event,
            sequence: ++browserLogSequence,
            activeAssistantTurnId,
            clientMicSampleIndex,
            queuedAudioDeltas: queuedAudioDeltas.length,
            currentPlayback: Boolean(currentPlayback),
            pausedPlayback: Boolean(pausedPlayback),
            localVadPlaybackPaused,
            serverSttPlaybackPaused,
            playbackReady: Boolean(isPlaybackReady()),
            audioContextState: playbackContext ? playbackContext.state : "none",
            ...fields
        };
        const url = `/chat/client-log?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`;
        const body = JSON.stringify(payload);
        if (navigator.sendBeacon) {
            const sent = navigator.sendBeacon(url, new Blob([body], { type: "application/json; charset=utf-8" }));
            if (sent) {
                return;
            }
        }
        fetch(url, {
            method: "POST",
            headers: {"Content-Type": "application/json; charset=utf-8"},
            body,
            keepalive: true
        }).catch(() => {
            // ログ送信失敗でチャット操作を止めない。
        });
    }

    async function startMicrophone() {
        if (audioContext) {
            return;
        }

        micToggle.disabled = true;
        micStatus.textContent = "requesting microphone";
        try {
            await preparePlayback();
            await ensureTenVadReady();
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    sampleRate: { ideal: targetSampleRate },
                    echoCancellation: true,
                    echoCancellationType: 'system',
                    noiseSuppression: true,
                    autoGainControl: false
                }
            });
            audioContext = new AudioContext();
            await audioContext.resume();
            resampler = createResampler(audioContext.sampleRate, targetSampleRate);
            micSource = audioContext.createMediaStreamSource(micStream);
            micProcessor = audioContext.createScriptProcessor(4096, 1, 1);
            micProcessor.onaudioprocess = (event) => {
                const input = event.inputBuffer.getChannelData(0);
                enqueueSamples(resampler(input));
            };
            micSource.connect(micProcessor);
            micProcessor.connect(audioContext.destination);
            updateMicrophoneButton(true);
            micStatus.textContent = microphoneStatus();
        } catch (error) {
            micStatus.textContent = `microphone error: ${error.message}`;
            micToggle.disabled = false;
            stopMicrophone();
        }
    }

    function toggleMicrophone() {
        if (audioContext) {
            stopMicrophone();
            return;
        }
        startMicrophone();
    }

    function updateMicrophoneButton(recording) {
        micToggle.disabled = false;
        micToggle.classList.toggle("recording", recording);
        micToggle.setAttribute("aria-label", recording ? "マイク停止" : "マイク開始");
        micToggle.title = recording ? "マイク停止" : "マイク開始";
    }

    async function ensureTenVadReady() {
        if (tenVadHandle) {
            return;
        }
        if (!tenVadModule) {
            tenVadModule = await createVADModule({
                locateFile: (path) => `/tenvad/${path}`
            });
            addTenVadHelpers();
        }
        tenVadHandlePtr = tenVadModule._malloc(4);
        const result = tenVadModule._ten_vad_create(tenVadHandlePtr, tenVadHopSamples, tenVadThreshold);
        if (result !== 0) {
            tenVadModule._free(tenVadHandlePtr);
            tenVadHandlePtr = 0;
            throw new Error(`TEN VAD create failed: ${result}`);
        }
        tenVadHandle = tenVadModule.getValue(tenVadHandlePtr, "i32");
        tenVadAudioPtr = tenVadModule._malloc(tenVadHopSamples * 2);
        tenVadProbabilityPtr = tenVadModule._malloc(4);
        tenVadFlagPtr = tenVadModule._malloc(4);
    }

    function addTenVadHelpers() {
        if (!tenVadModule.getValue) {
            tenVadModule.getValue = (ptr, type) => {
                const view = new DataView(tenVadModule.HEAPU8.buffer);
                if (type === "i32") {
                    return view.getInt32(ptr, true);
                }
                if (type === "float") {
                    return view.getFloat32(ptr, true);
                }
                throw new Error(`unsupported TEN VAD value type: ${type}`);
            };
        }
    }

    function destroyTenVad() {
        if (!tenVadModule) {
            return;
        }
        if (tenVadAudioPtr) {
            tenVadModule._free(tenVadAudioPtr);
            tenVadAudioPtr = 0;
        }
        if (tenVadProbabilityPtr) {
            tenVadModule._free(tenVadProbabilityPtr);
            tenVadProbabilityPtr = 0;
        }
        if (tenVadFlagPtr) {
            tenVadModule._free(tenVadFlagPtr);
            tenVadFlagPtr = 0;
        }
        if (tenVadHandlePtr) {
            tenVadModule._ten_vad_destroy(tenVadHandlePtr);
            tenVadModule._free(tenVadHandlePtr);
            tenVadHandlePtr = 0;
            tenVadHandle = 0;
        }
    }

    function microphoneStatus() {
        const track = micStream.getAudioTracks()[0];
        const settings = track ? track.getSettings() : {};
        const trackRate = settings.sampleRate ? `${settings.sampleRate}Hz` : "unknown";
        const trackChannels = settings.channelCount ? `${settings.channelCount}ch` : "unknown";
        return `microphone track ${trackRate} ${trackChannels}; context ${audioContext.sampleRate}Hz; sending ${targetSampleRate}Hz`;
    }

    function stopMicrophone() {
        if (micProcessor) {
            micProcessor.disconnect();
            micProcessor.onaudioprocess = null;
            micProcessor = null;
        }
        if (micSource) {
            micSource.disconnect();
            micSource = null;
        }
        if (micStream) {
            micStream.getTracks().forEach((track) => track.stop());
            micStream = null;
        }
        if (audioContext) {
            audioContext.close();
            audioContext = null;
        }
        try {
            flushSamples(true);
        } catch (error) {
            micStatus.textContent = `audio send error: ${error.message}`;
        }
        destroyTenVad();
        resampler = null;
        updateMicrophoneButton(false);
        updateSpeechState("UNDETECTED");
        if (!micStatus.textContent.startsWith("audio send error:")
                && !micStatus.textContent.startsWith("microphone error:")) {
            micStatus.textContent = "microphone stopped";
        }
    }

    function updateSpeechState(state) {
        speechDetectionState = state;
        updateStatusDisplay();
    }

    function updateAssistantState(state) {
        assistantPipelineState = state === "LLM" || state === "TTS" ? state : "IDLE";
        updateStatusDisplay();
    }

    function updateStatusDisplay() {
        const activeStates = new Set(["DETECTED", "TRAILING_SILENCE", "TURN_DETECTING", "TRANSCRIBING"]);
        const speechActive = activeStates.has(speechDetectionState);
        const displayState = speechActive ? speechDetectionState : assistantPipelineState;
        const labels = {
            DETECTED: "REC",
            TRAILING_SILENCE: "WAIT",
            TURN_DETECTING: "TURN",
            TRANSCRIBING: "STT",
            LLM: "LLM",
            TTS: "TTS",
            IDLE: "IDLE"
        };
        const displayText = labels[displayState] || "IDLE";
        speechState.dataset.state = displayState;
        speechState.classList.toggle("active", speechActive || assistantPipelineState !== "IDLE");
        speechStateText.textContent = displayText;
        speechState.title = displayState;
    }

    function createResampler(inputSampleRate, outputSampleRate) {
        let previousSample = null;
        let sourceOffset = 0;
        const ratio = inputSampleRate / outputSampleRate;

        return (input) => {
            const source = previousSample === null ? input : prepend(previousSample, input);
            const outputLength = Math.max(0, Math.floor((source.length - 1 - sourceOffset) / ratio));
            const output = new Float32Array(outputLength);
            for (let i = 0; i < outputLength; i++) {
                const position = sourceOffset + i * ratio;
                const index = Math.floor(position);
                const fraction = position - index;
                output[i] = source[index] + (source[index + 1] - source[index]) * fraction;
            }
            const consumedPosition = sourceOffset + outputLength * ratio;
            sourceOffset = consumedPosition - Math.floor(consumedPosition);
            previousSample = source[source.length - 1];
            return output;
        };
    }

    function prepend(sample, input) {
        const values = new Float32Array(input.length + 1);
        values[0] = sample;
        values.set(input, 1);
        return values;
    }

    function enqueueSamples(samples) {
        if (samples.length === 0) {
            return;
        }
        if (pendingSampleCount === 0) {
            pendingStartSampleIndex = clientMicSampleIndex;
        }
        pendingSamples.push(samples);
        pendingSampleCount += samples.length;
        clientMicSampleIndex += samples.length;
        if (pendingSampleCount >= sendSampleThreshold) {
            try {
                flushSamples();
            } catch (error) {
                micStatus.textContent = `audio send error: ${error.message}`;
            }
        }
    }

    function analyzeLocalTenVad(vadBytes) {
        if (!currentPlayback && !pausedPlayback) {
            loudVadFrameCount = 0;
            quietVadFrameCount = 0;
            return;
        }
        for (const vadValue of vadBytes) {
            const speechValue = vadValue & 0x7f;
            if (localVadPlaybackPaused) {
                quietVadFrameCount = speechValue < localResumeVadThreshold ? quietVadFrameCount + 1 : 0;
                if (quietVadFrameCount >= localResumeSilenceVadFrames) {
                    quietVadFrameCount = 0;
                    loudVadFrameCount = 0;
                    resumePlaybackForLocalVad(activeAssistantTurnId);
                    return;
                }
            } else {
                loudVadFrameCount = speechValue >= localPauseVadThreshold ? loudVadFrameCount + 1 : 0;
                if (loudVadFrameCount >= localPauseConsecutiveVadFrames) {
                    pausePlaybackForLocalVad(activeAssistantTurnId);
                    loudVadFrameCount = 0;
                    quietVadFrameCount = 0;
                    return;
                }
            }
        }
    }

    function flushSamples(includeRemainder = false) {
        if (pendingSampleCount === 0) {
            return;
        }
        const alignedSampleCount = pendingSampleCount - (pendingSampleCount % tenVadHopSamples);
        const sendSampleCount = includeRemainder ? pendingSampleCount : alignedSampleCount;
        if (sendSampleCount === 0) {
            return;
        }
        const pcmSamples = takePendingPcmSamples(sendSampleCount);
        const vadBytes = processTenVad(pcmSamples);
        const body = createPcmVadBody(pcmSamples, vadBytes);
        const startSample = pendingStartSampleIndex;
        const endSample = startSample + pcmSamples.length;
        postAudio(body, startSample, endSample);
        if (pendingSampleCount > 0) {
            pendingStartSampleIndex = endSample;
        }
    }

    function takePendingPcmSamples(sampleCount) {
        const pcmSamples = new Int16Array(sampleCount);
        let targetOffset = 0;
        while (targetOffset < sampleCount) {
            const source = pendingSamples[0];
            const copyCount = Math.min(source.length, sampleCount - targetOffset);
            for (let i = 0; i < copyCount; i++) {
                pcmSamples[targetOffset + i] = floatToPcm16(source[i]);
            }
            targetOffset += copyCount;
            if (copyCount === source.length) {
                pendingSamples.shift();
            } else {
                pendingSamples[0] = source.subarray(copyCount);
            }
            pendingSampleCount -= copyCount;
        }
        return pcmSamples;
    }

    function floatToPcm16(sample) {
        const clamped = Math.max(-1, Math.min(1, sample));
        return clamped < 0 ? Math.round(clamped * 32768) : Math.round(clamped * 32767);
    }

    function processTenVad(pcmSamples) {
        const frameCount = Math.floor(pcmSamples.length / tenVadHopSamples);
        const vadBytes = new Uint8Array(frameCount);
        for (let frameIndex = 0; frameIndex < frameCount; frameIndex++) {
            const frameOffset = frameIndex * tenVadHopSamples;
            tenVadModule.HEAP16.set(pcmSamples.subarray(frameOffset, frameOffset + tenVadHopSamples), tenVadAudioPtr / 2);
            const result = tenVadModule._ten_vad_process(
                tenVadHandle,
                tenVadAudioPtr,
                tenVadHopSamples,
                tenVadProbabilityPtr,
                tenVadFlagPtr
            );
            if (result !== 0) {
                throw new Error(`TEN VAD process failed: ${result}`);
            }
            const probability = tenVadModule.getValue(tenVadProbabilityPtr, "float");
            const value = Math.max(0, Math.min(100, Math.round(probability * 100)));
            const playbackFlag = (currentPlayback || pausedPlayback) ? 0x80 : 0;
            vadBytes[frameIndex] = (value & 0x7f) | playbackFlag;
        }
        analyzeLocalTenVad(vadBytes);
        return vadBytes;
    }

    function createPcmVadBody(pcmSamples, vadBytes) {
        const body = new ArrayBuffer(pcmVadHeaderBytes + pcmSamples.byteLength + vadBytes.byteLength);
        const view = new DataView(body);
        const bytes = new Uint8Array(body);
        bytes[0] = 0x4d;
        bytes[1] = 0x56;
        bytes[2] = 0x41;
        bytes[3] = 0x44;
        view.setUint16(4, 1, true);
        view.setUint16(6, 0, true);
        view.setUint32(8, targetSampleRate, true);
        view.setUint16(12, 1, true);
        view.setUint16(14, 1, true);
        view.setUint32(16, pcmSamples.length, true);
        view.setUint32(20, tenVadHopSamples, true);
        view.setUint32(24, vadBytes.length, true);
        view.setUint32(28, 0, true);
        for (let i = 0; i < pcmSamples.length; i++) {
            view.setInt16(pcmVadHeaderBytes + i * 2, pcmSamples[i], true);
        }
        bytes.set(vadBytes, pcmVadHeaderBytes + pcmSamples.byteLength);
        return body;
    }

    function postAudio(body, startSample, endSample) {
        postQueue = postQueue
            .then(() => fetch(`/chat/request?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
                method: "POST",
                headers: {
                    "Content-Type": pcmVadContentType,
                    "X-Client-Mic-Start-Sample": String(startSample),
                    "X-Client-Mic-End-Sample": String(endSample)
                },
                body
            }))
            .then((response) => {
                if (!response.ok) {
                    return response.text().then((text) => {
                        throw new Error(text || `HTTP ${response.status}`);
                    });
                }
            })
            .catch((error) => {
                micStatus.textContent = `audio send error: ${error.message}`;
            });
    }

    async function ensurePlaybackReady() {
        if (!playbackContext) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                clientLog("playback-context-unsupported");
                throw new Error("AudioContext is not supported");
            }
            playbackContext = new AudioContextClass();
            clientLog("playback-context-created", { audioContextState: playbackContext.state });
        }
        if (playbackContext.state !== "running") {
            await playbackContext.resume();
            clientLog("playback-context-resumed", { audioContextState: playbackContext.state });
        }
    }

    function preparePlayback() {
        return withTimeout(ensurePlaybackReady(), 1500, "AudioContext resume timed out")
            .then(flushQueuedAudioDeltas)
            .catch((error) => {
                appendSystem(`audio playback init error: ${error.message}`);
            });
    }

    function withTimeout(promise, timeoutMs, message) {
        let timeoutId = 0;
        const timeout = new Promise((resolve, reject) => {
            timeoutId = setTimeout(() => reject(new Error(message)), timeoutMs);
        });
        return Promise.race([promise, timeout]).finally(() => clearTimeout(timeoutId));
    }

    function isPlaybackReady() {
        return playbackContext && playbackContext.state === "running";
    }

    function normalizeAssistantChunk(payload) {
        return {
            assistantTurnId: payload.assistantTurnId || 0,
            chunkId: payload.chunkId || 0,
            text: payload.text || "",
            audioDeltas: Array.isArray(payload.audioDeltas) ? payload.audioDeltas : [],
            audioDurationSeconds: Number(payload.audioDurationSeconds || 0),
            recognized: false,
            rendered: null
        };
    }

    function chunkHasAudio(payload) {
        return payload.audioDeltas && payload.audioDeltas.some((delta) => delta.data);
    }

    function queueAudioDelta(payload) {
        const turnId = payload.assistantTurnId || 0;
        if (canceledAssistantTurnIds.has(turnId) || turnId < activeAssistantTurnId) {
            clientLog("audio-delta-dropped", {
                assistantTurnId: turnId,
                chunkId: payload.chunkId || 0,
                detail: `canceled=${canceledAssistantTurnIds.has(turnId)};older=${turnId < activeAssistantTurnId}`
            });
            return;
        }
        activeAssistantTurnId = Math.max(activeAssistantTurnId, turnId);
        if (chunkHasAudio(payload) && !isPlaybackReady()) {
            queuedAudioDeltas.push(payload);
            clientLog("audio-delta-queued-waiting-context", {
                assistantTurnId: turnId,
                chunkId: payload.chunkId || 0,
                detail: `audioDeltas=${payload.audioDeltas.length}`
            });
            if (queuedAudioDeltas.length > 100) {
                queuedAudioDeltas = queuedAudioDeltas.slice(-100);
                clientLog("audio-delta-queue-trimmed", { assistantTurnId: turnId });
            }
            preparePlayback();
            return;
        }
        queuedAudioDeltas.push(payload);
        clientLog("audio-delta-queued", {
            assistantTurnId: turnId,
            chunkId: payload.chunkId || 0,
            detail: `audioDeltas=${payload.audioDeltas.length}`
        });
        pumpPlayback();
    }

    function flushQueuedAudioDeltas() {
        if (!isPlaybackReady() || queuedAudioDeltas.length === 0) {
            clientLog("flush-queued-audio-skipped", {
                detail: `ready=${isPlaybackReady()};queued=${queuedAudioDeltas.length}`
            });
            return;
        }
        clientLog("flush-queued-audio");
        pumpPlayback();
    }

    function pumpPlayback() {
        const nextPayload = queuedAudioDeltas[0];
        const needsAudio = nextPayload && chunkHasAudio(nextPayload);
        if ((needsAudio && !isPlaybackReady()) || isPlaybackPaused() || currentPlayback || queuedAudioDeltas.length === 0) {
            clientLog("pump-playback-blocked", {
                detail: `ready=${isPlaybackReady()};paused=${isPlaybackPaused()};current=${Boolean(currentPlayback)};queued=${queuedAudioDeltas.length};needsAudio=${Boolean(needsAudio)}`
            });
            return;
        }
        const payload = queuedAudioDeltas.shift();
        const turnId = payload.assistantTurnId || 0;
        if (canceledAssistantTurnIds.has(turnId) || turnId < activeAssistantTurnId) {
            clientLog("pump-playback-drop-payload", {
                assistantTurnId: turnId,
                chunkId: payload.chunkId || 0,
                detail: `canceled=${canceledAssistantTurnIds.has(turnId)};older=${turnId < activeAssistantTurnId}`
            });
            pumpPlayback();
            return;
        }
        try {
            clientLog("pump-playback-start", { assistantTurnId: turnId, chunkId: payload.chunkId || 0 });
            startPlayback(payload, 0);
        } catch (error) {
            clientLog("pump-playback-error", { assistantTurnId: turnId, chunkId: payload.chunkId || 0, error: error.message });
            appendSystem(`audio playback error: ${error.message}`);
            currentPlayback = null;
            pumpPlayback();
        }
    }

    function startPlayback(payload, offsetSeconds) {
        if (!payload.rendered && payload.text) {
            payload.rendered = {
                bubble: appendAssistantDelta(payload.text),
                text: payload.text
            };
        }
        if (!chunkHasAudio(payload)) {
            payload.recognized = true;
            clientLog("start-playback-text-only-payload", {
                assistantTurnId: payload.assistantTurnId || 0,
                chunkId: payload.chunkId || 0
            });
            reportPlayback("end", payload.assistantTurnId || 0, payload, 0, true);
            pumpPlayback();
            return;
        }
        const decoded = decodeAudioDeltas(payload.audioDeltas);
        const buffer = playbackContext.createBuffer(1, decoded.samples.length, decoded.sampleRate);
        payload.audioDurationSeconds = payload.audioDurationSeconds || buffer.duration;
        buffer.copyToChannel(decoded.samples, 0);

        const source = playbackContext.createBufferSource();
        source.buffer = buffer;
        source.connect(playbackContext.destination);
        currentPlayback = {
            payload,
            source,
            offsetSeconds,
            startedAt: playbackContext.currentTime,
            durationSeconds: buffer.duration,
            stopRequested: false
        };
        clientLog("playback-start", {
            assistantTurnId: payload.assistantTurnId || 0,
            chunkId: payload.chunkId || 0,
            detail: `offsetSeconds=${offsetSeconds};samples=${decoded.samples.length};duration=${buffer.duration}`
        });
        reportPlayback(offsetSeconds > 0 ? "resume" : "start", payload.assistantTurnId || 0, payload, offsetSeconds, false);
        source.onended = () => {
            const playback = currentPlayback;
            if (!playback || playback.source !== source) {
                return;
            }
            currentPlayback = null;
            if (!playback.stopRequested) {
                const playedSeconds = playback.durationSeconds;
                const recognized = !playback.payload.recognized
                    && shouldRecognizePlayback(playback.payload, playedSeconds, true);
                playback.payload.recognized = playback.payload.recognized || recognized;
                clientLog("playback-ended", {
                    assistantTurnId: playback.payload.assistantTurnId || 0,
                    chunkId: playback.payload.chunkId || 0,
                    detail: `recognized=${recognized};playedSeconds=${playedSeconds}`
                });
                reportPlayback("end", playback.payload.assistantTurnId || 0, playback.payload, playedSeconds, recognized);
                pumpPlayback();
            } else {
                clientLog("playback-ended-after-stop", {
                    assistantTurnId: playback.payload.assistantTurnId || 0,
                    chunkId: playback.payload.chunkId || 0
                });
            }
        };
        source.start(0, Math.min(offsetSeconds, buffer.duration));
    }

    function handleAudioControl(payload) {
        const assistantTurnId = payload.assistantTurnId || 0;
        if (assistantTurnId <= 0) {
            clientLog("audio-control-ignored-without-assistant-turn", {
                assistantTurnId,
                detail: `action=${payload.action || ""}`
            });
            return;
        }
        activeAssistantTurnId = Math.max(activeAssistantTurnId, assistantTurnId);
        if (payload.action === "pause") {
            pausePlaybackForServerSttWait(assistantTurnId);
            return;
        }
        if (payload.action === "resume") {
            resumePlaybackForServerSttWait(assistantTurnId);
            return;
        }
        if (payload.action === "cancel") {
            cancelPlayback(assistantTurnId);
        }
    }

    function isPlaybackPaused() {
        return localVadPlaybackPaused || serverSttPlaybackPaused;
    }

    function pausePlaybackForLocalVad(assistantTurnId) {
        if (assistantTurnId !== activeAssistantTurnId) {
            clientLog("local-vad-pause-ignored", {
                assistantTurnId,
                detail: `activeAssistantTurnId=${activeAssistantTurnId}`
            });
            return;
        }
        const wasPaused = isPlaybackPaused();
        localVadPlaybackPaused = true;
        clientLog("local-vad-pause-set", { assistantTurnId, detail: `wasPaused=${wasPaused}` });
        pauseCurrentPlayback(assistantTurnId, wasPaused);
    }

    function pausePlaybackForServerSttWait(assistantTurnId) {
        if (assistantTurnId !== activeAssistantTurnId) {
            clientLog("server-stt-pause-ignored", {
                assistantTurnId,
                detail: `activeAssistantTurnId=${activeAssistantTurnId}`
            });
            return;
        }
        const wasPaused = isPlaybackPaused();
        serverSttPlaybackPaused = true;
        clientLog("server-stt-pause-set", { assistantTurnId, detail: `wasPaused=${wasPaused}` });
        pauseCurrentPlayback(assistantTurnId, wasPaused);
    }

    function pauseCurrentPlayback(assistantTurnId, wasPaused) {
        if (wasPaused) {
            clientLog("pause-current-playback-already-paused", { assistantTurnId });
            return;
        }
        if (!currentPlayback || !playbackContext) {
            clientLog("pause-current-playback-no-current", { assistantTurnId });
            return;
        }
        const playback = currentPlayback;
        const elapsed = Math.max(0, playbackContext.currentTime - playback.startedAt);
        playback.offsetSeconds += elapsed;
        const playedSeconds = playback.offsetSeconds;
        const recognized = !playback.payload.recognized
            && shouldRecognizePlayback(playback.payload, playedSeconds, false);
        playback.payload.recognized = playback.payload.recognized || recognized;
        playback.stopRequested = true;
        pausedPlayback = {
            payload: playback.payload,
            offsetSeconds: playback.offsetSeconds
        };
        playback.source.stop();
        clientLog("pause-current-playback-stopped-source", {
            assistantTurnId,
            chunkId: playback.payload.chunkId || 0,
            detail: `offsetSeconds=${playback.offsetSeconds};elapsed=${elapsed};recognized=${playback.payload.recognized}`
        });
        reportPlayback("pause", assistantTurnId, playback.payload, playedSeconds, recognized);
    }

    function resumePlaybackForLocalVad(assistantTurnId) {
        if (assistantTurnId !== activeAssistantTurnId || canceledAssistantTurnIds.has(assistantTurnId)) {
            clientLog("local-vad-resume-ignored", {
                assistantTurnId,
                detail: `activeAssistantTurnId=${activeAssistantTurnId};canceled=${canceledAssistantTurnIds.has(assistantTurnId)}`
            });
            return;
        }
        localVadPlaybackPaused = false;
        clientLog("local-vad-resume-set", { assistantTurnId });
        resumePlaybackIfUnpaused(assistantTurnId);
    }

    function resumePlaybackForServerSttWait(assistantTurnId) {
        if (assistantTurnId !== activeAssistantTurnId || canceledAssistantTurnIds.has(assistantTurnId)) {
            clientLog("server-stt-resume-ignored", {
                assistantTurnId,
                detail: `activeAssistantTurnId=${activeAssistantTurnId};canceled=${canceledAssistantTurnIds.has(assistantTurnId)}`
            });
            return;
        }
        serverSttPlaybackPaused = false;
        clientLog("server-stt-resume-set", { assistantTurnId });
        resumePlaybackIfUnpaused(assistantTurnId);
    }

    function resumePlaybackIfUnpaused(assistantTurnId) {
        if (isPlaybackPaused()) {
            clientLog("resume-playback-still-paused", { assistantTurnId });
            return;
        }
        if (pausedPlayback) {
            const playback = pausedPlayback;
            pausedPlayback = null;
            try {
                clientLog("resume-paused-playback", {
                    assistantTurnId,
                    detail: `offsetSeconds=${playback.offsetSeconds}`
                });
                startPlayback(playback.payload, playback.offsetSeconds);
                return;
            } catch (error) {
                clientLog("resume-playback-error", { assistantTurnId, error: error.message });
                appendSystem(`audio resume error: ${error.message}`);
            }
        }
        clientLog("resume-pump-playback", { assistantTurnId });
        pumpPlayback();
    }

    function cancelPlayback(assistantTurnId) {
        canceledAssistantTurnIds.add(assistantTurnId);
        clientLog("cancel-playback-received", { assistantTurnId });
        if (assistantTurnId === activeAssistantTurnId) {
            localVadPlaybackPaused = false;
            serverSttPlaybackPaused = false;
            clientLog("cancel-playback-cleared-pauses", { assistantTurnId });
        }
        queuedAudioDeltas = queuedAudioDeltas.filter((payload) => (payload.assistantTurnId || 0) !== assistantTurnId);
        if (pausedPlayback && (pausedPlayback.payload.assistantTurnId || 0) === assistantTurnId) {
            rollbackUnrecognizedChunk(pausedPlayback.payload);
            pausedPlayback = null;
            clientLog("cancel-playback-cleared-paused-source", { assistantTurnId });
        }
        if (currentPlayback && (currentPlayback.payload.assistantTurnId || 0) === assistantTurnId) {
            const playback = currentPlayback;
            const elapsed = playbackContext ? Math.max(0, playbackContext.currentTime - playback.startedAt) : 0;
            const playedSeconds = playback.offsetSeconds + elapsed;
            const recognized = !playback.payload.recognized
                && shouldRecognizePlayback(playback.payload, playedSeconds, false);
            playback.payload.recognized = playback.payload.recognized || recognized;
            if (!playback.payload.recognized) {
                rollbackUnrecognizedChunk(playback.payload);
            }
            reportPlayback("cancel", assistantTurnId, playback.payload, playedSeconds, playback.payload.recognized);
            playback.stopRequested = true;
            playback.source.stop();
            currentPlayback = null;
            clientLog("cancel-playback-stopped-current-source", {
                assistantTurnId,
                chunkId: playback.payload.chunkId || 0
            });
        } else {
            reportPlayback("cancel", assistantTurnId, { chunkId: 0, audioDurationSeconds: 0 }, 0, false);
        }
        pumpPlayback();
    }

    function shouldRecognizePlayback(payload, playedSeconds, completed) {
        const durationSeconds = Number(payload.audioDurationSeconds || 0);
        if (playedSeconds >= 0.4) {
            return true;
        }
        return completed && durationSeconds >= 0 && durationSeconds < 0.4;
    }

    function rollbackUnrecognizedChunk(payload) {
        if (!payload || payload.recognized || !payload.rendered) {
            return;
        }
        removeAssistantDelta(payload.rendered.bubble, payload.rendered.text);
        payload.rendered = null;
        clientLog("assistant-chunk-rollback", {
            assistantTurnId: payload.assistantTurnId || 0,
            chunkId: payload.chunkId || 0
        });
    }

    function reportPlayback(state, assistantTurnId, payload = {}, playedSeconds = 0, recognized = false) {
        if (!assistantTurnId) {
            return;
        }
        fetch(`/chat/playback?group=${encodeURIComponent(groupInput.value)}&sessionId=${encodeURIComponent(sessionId)}`, {
            method: "POST",
            headers: {"Content-Type": "application/json; charset=utf-8"},
            body: JSON.stringify({
                assistantTurnId,
                chunkId: payload.chunkId || 0,
                state,
                recognized,
                playedSeconds,
                durationSeconds: payload.audioDurationSeconds || 0,
                clientMicSampleIndex
            })
        }).catch((error) => {
            appendSystem(`playback report error: ${error.message}`);
        });
    }

    function decodeAudioDeltas(audioDeltas) {
        const decoded = audioDeltas
            .filter((delta) => delta.data)
            .map((delta) => ({
                samples: decodePcm16Le(delta.data),
                sampleRate: delta.sampleRate || 24000
            }));
        if (decoded.length === 0) {
            return { samples: new Float32Array(0), sampleRate: 24000 };
        }
        const sampleRate = decoded[0].sampleRate;
        const totalSamples = decoded.reduce((sum, delta) => sum + delta.samples.length, 0);
        const samples = new Float32Array(totalSamples);
        let offset = 0;
        for (const delta of decoded) {
            if (delta.sampleRate !== sampleRate) {
                throw new Error(`mixed sample rates: ${sampleRate}, ${delta.sampleRate}`);
            }
            samples.set(delta.samples, offset);
            offset += delta.samples.length;
        }
        return { samples, sampleRate };
    }

    function decodePcm16Le(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        const view = new DataView(bytes.buffer);
        const samples = new Float32Array(bytes.byteLength / 2);
        for (let i = 0; i < samples.length; i++) {
            samples[i] = view.getInt16(i * 2, true) / 32768;
        }
        return samples;
    }

    function resetPlayback() {
        if (playbackContext) {
            playbackContext.close();
            playbackContext = null;
        }
        queuedAudioDeltas = [];
        currentPlayback = null;
        pausedPlayback = null;
        localVadPlaybackPaused = false;
        serverSttPlaybackPaused = false;
        activeAssistantTurnId = 0;
        loudVadFrameCount = 0;
        quietVadFrameCount = 0;
        canceledAssistantTurnIds.clear();
    }
